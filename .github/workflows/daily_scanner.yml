name: Ultra Sniper Daily Scanner

on:
  workflow_dispatch:

  schedule:
  - cron: "30 21 * * *"

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas numpy requests ta lxml html5lib beautifulsoup4 openpyxl

      - name: Check repository files
        run: |
          echo "=== DIRECTORY ==="
          pwd
          echo "=== FILE PRESENTI ==="
          find . -maxdepth 4 -type f -print

      - name: Run Ultra Sniper
        env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          SCRIPT=$(find . -iname "scanner.py" -type f | head -n 1)
          echo "Scanner trovato: $SCRIPT"
          python "$SCRIPT"

      - name: Save results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ultra-sniper-results
          path: ULTRA_SNIPER_RESULTS.csv
          if-no-files-found: ignore
